version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar-backend
    ports:
      - "8000:8000"
    environment:
      # Application settings
      - APP_NAME=Radar Visualization
      - BASE_URL=http://localhost:8000
      - FRONTEND_ORIGINS=["http://localhost:3000","http://localhost"]
      - ALLOWED_EXTENSIONS=[".nc", ".BUFR", ".bufr"]

      # Directories (absolute paths in container)
      - UPLOAD_DIR=/app/app/storage/uploads
      - DATA_DIR=/app/app/storage/data
      - IMAGES_DIR=/app/app/storage/tmp
      - CACHE_DIR=/app/app/storage/cache

      # Upload rules
      - MAX_UPLOAD_MB=100

      # Auth & database
      - JWT_SECRET=CHANGE-ME-IN-PRODUCTION
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - DB_DIR=/app/app/storage/db
      - LOG_DIR=/app/app/storage/logs

      # Python output buffering (critical for Docker logs)
      - PYTHONUNBUFFERED=1

      # GDAL optimizations (deben coincidir con los setdefault de main.py)
      - GDAL_CACHEMAX=512
      - GDAL_NUM_THREADS=ALL_CPUS
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=262144000
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_MAX_DATASET_POOL_SIZE=450
      - GDAL_FORCE_CACHING=NO
      - PROJ_NETWORK=OFF
    volumes:
      # Datos estáticos: DEMs, shapefiles (solo lectura)
      - ./backend/app/storage/data:/app/app/storage/data:ro
      # Archivos cacheados (matriz W)
      - ./backend/app/storage/cache:/app/app/storage/cache
      # Base de datos SQLite (usuarios, access logs)
      - ./backend/app/storage/db:/app/app/storage/db
      # Logs del backend (accesibles via /admin/logs)
      - ./backend/app/storage/logs:/app/app/storage/logs
      # GeoLite2 para resolución de IP a ciudad/país (opcional)
      - ./backend/app/storage/geolite2:/app/app/storage/geolite2:ro
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6G
        reservations:
          cpus: "2"
          memory: 2G
    networks:
      - radar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_MAPBOX_TOKEN: CHANGE-ME-IN-PRODUCTION
    container_name: radar-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - radar-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  radar-network:
    driver: bridge
# For production deployment (no persistence):
# Remove the volumes section from backend service
# Sessions and files will be ephemeral and cleared on container restart
